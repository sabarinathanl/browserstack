userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: playwright

projectName: OrangeHRM-Cloud-Testing
buildName: OrangeHRM-Playwright-Build

platforms:
  - os: Windows
    osVersion: 11
    browserName: playwright-chromium
    browserVersion: latest

  - os: Windows
    osVersion: 11
    browserName: edge
    browserVersion: latest

  - os: Windows
    osVersion: 11
    browserName: playwright-firefox
    browserVersion: latest

  - os: OS X
    osVersion: Ventura
    browserName: playwright-webkit
    browserVersion: latest

  #mobile platforms
  - os: iOS
    osVersion: 15.0
    device: iPhone 13
    realMobile: true
  - os: Android
    osVersion: 12.0
    device: Samsung Galaxy S22
    realMobile: true

parallelsPerPlatform: 1

browserstackLocal: false

debug: true
video: true
networkLogs: true
consoleLogs: info
testReporting: true